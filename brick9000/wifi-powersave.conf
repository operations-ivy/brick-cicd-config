# Installed as /etc/NetworkManager/conf.d/brick-wifi-powersave.conf by
# install.sh. 2 = power save off, so brcmfmac's radio doesn't doze. Added
# 2026-11-07 (#146) for brick9000 missing broadcast ARP requests; that turned
# out to be a lost Wi-Fi group key instead (wifi-watchdog), but a board that
# answers promptly is worth keeping it off.
[connection]
wifi.powersave = 2
