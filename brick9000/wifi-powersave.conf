# Installed as /etc/NetworkManager/conf.d/brick-wifi-powersave.conf by
# install.sh. 2 = power save off. With it on, brcmfmac's dozing radio misses
# broadcast ARP requests, so a machine that doesn't already know brick9000's
# MAC can't reach it (2026-11-07: the laptop's SSH failed with "no route to
# host" while the cluster's scrapes, to a known MAC, kept working).
[connection]
wifi.powersave = 2
