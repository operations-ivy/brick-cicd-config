# RetroArch core override for its built-in video player (the "FFmpeg" core
# that plays brick9000's Movies and TV playlists). Installed by install.sh
# to ~/.config/retroarch/config/FFmpeg/FFmpeg.cfg.
#
# The 8BitDo sleeps after 15-20 idle minutes, which nobody notices during a
# film: games still pause when a pad drops (retroarch.cfg), videos play on
# (the user, 2026-11-23).
pause_on_disconnect = "false"

# No CRT shader on films and TV (the user, 2026-11-23: "looks better without
# the shaders"). Games keep it: brick-retro starts RetroArch with
# --set-shader for every core, and this turns shaders off for this one.
video_shader_enable = "false"
