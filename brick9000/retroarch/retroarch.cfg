# brick9000's RetroArch settings, applied over its own retroarch.cfg with
# --appendconfig by brick-retro (so these always win). Paths with ~ are
# expanded by RetroArch.

# Over the board, full screen, on labwc.
video_fullscreen = "true"
video_driver = "gl"
video_context_driver = "wayland"
menu_driver = "xmb"

# The menu dressed like the board (brick-status's colours and type): its
# wallpaper (generated by brick-retro/tools/wallpaper.py), IBM Plex Mono
# (fonts-ibm-plex, install.sh), bone text (#d9d3bf), and flat: no animated
# ribbon, no shadows.
menu_wallpaper = "~/brick-cicd-config/brick9000/retroarch/wallpaper.png"
menu_wallpaper_opacity = "1.000000"
menu_shader_pipeline = "0"
xmb_shadows_enable = "false"
xmb_font = "/usr/share/fonts/truetype/ibm-plex/IBMPlexMono-Medium.ttf"
menu_font_color_red = "217"
menu_font_color_green = "211"
menu_font_color_blue = "191"
xmb_theme = "0"

# The Picade's DAC through PipeWire. Its speaker is very loud: RetroArch stays
# 6 dB down, and the system volume (Home + D-pad, brick-retro) is capped.
audio_driver = "pulse"
audio_volume = "-6.0"

# Controllers: Bluetooth pads through udev, mapped by the autoconfig files
# in brick9000/retroarch/autoconfig (installed by install.sh).
input_joypad_driver = "udev"
input_autodetect_enable = "true"
joypad_autoconfig_dir = "~/.config/retroarch/autoconfig"
# A Bluetooth drop pauses the game instead of letting it run on.
pause_on_disconnect = "true"
# But losing window focus doesn't: the board's Chromium underneath can take
# it, and the pad (udev) works without focus anyway.
pause_nonactive = "false"
# Start + Select opens the menu (4); Home is brick-retro's (launch, volume).
input_menu_toggle_gamepad_combo = "4"
input_enable_hotkey_btn = "nul"
quit_press_twice = "true"

# Games, saves and states. Battery saves are flushed every 10 seconds, and a
# state is saved on quit and loaded on start, so closing never loses progress.
libretro_directory = "/usr/lib/aarch64-linux-gnu/libretro"
libretro_info_path = "/usr/share/libretro/info"
playlist_directory = "~/.config/retroarch/playlists"
rgui_browser_directory = "~/games/roms"
# BIOS files (PlayStation needs one), copied from brick2000 by sync-roms.
system_directory = "~/games/system"
savefile_directory = "~/games/saves"
savestate_directory = "~/games/states"
autosave_interval = "10"
savestate_auto_save = "true"
savestate_auto_load = "true"
sort_savefiles_enable = "false"
sort_savestates_enable = "false"

# Thumbnails in the game lists: box art on the right, a screenshot on the
# left. brick-retro fetches them every day (brick_retro/thumbnails.py, named
# after each playlist label); RetroArch's own on-demand fetch asks for the
# label as-is, which mostly misses, so it's off.
thumbnails_directory = "~/.config/retroarch/thumbnails"
menu_thumbnails = "3"
menu_left_thumbnails = "1"
network_on_demand_thumbnails = "false"

# Shaders on (brick-retro passes crt-pi with --set-shader), and core options
# from the repo (retroarch/core-options.cfg, installed by install.sh).
video_shader_enable = "true"
global_core_options = "true"
core_options_path = "~/.config/retroarch/brick-core-options.cfg"

# Nothing to download or update from inside RetroArch: install.sh owns it.
menu_show_core_updater = "false"
menu_show_online_updater = "false"
config_save_on_exit = "false"
# The core info directory is the package's, read-only.
core_info_cache_enable = "false"
