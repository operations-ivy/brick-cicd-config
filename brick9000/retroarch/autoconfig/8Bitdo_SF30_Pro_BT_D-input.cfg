# 8Bitdo SF30 Pro over Bluetooth in D-input mode (turn on with Start + B), as
# paired with brick9000. Button numbers from libretro's
# retroarch-joypad-autoconfig (udev/8Bitdo_Pro_SF30_BT_B.cfg), without its
# menu toggle: Home belongs to brick-retro (open the games, volume), and the
# menu is Start + Select (retroarch.cfg).
#
# No analog sticks: the games here play on the D-pad (PlayStation's is the
# digital pad, PCSX-ReARMed's default), and over Bluetooth
# this pad reports both sticks fully pushed (0) from connecting until they
# first move, which RetroArch reads as the menu or game drifting.
input_driver = "udev"
input_device = "8Bitdo SF30 Pro"
input_device_display_name = "8BitDo SF30 Pro"
input_vendor_id = "11720"
input_product_id = "24832"

input_a_btn = "0"
input_b_btn = "1"
input_x_btn = "3"
input_y_btn = "4"
input_l_btn = "6"
input_r_btn = "7"
input_l2_btn = "8"
input_r2_btn = "9"
input_select_btn = "10"
input_start_btn = "11"
input_l3_btn = "13"
input_r3_btn = "14"
input_up_btn = "h0up"
input_down_btn = "h0down"
input_left_btn = "h0left"
input_right_btn = "h0right"
input_l_x_plus_axis = "nul"
input_l_x_minus_axis = "nul"
input_l_y_plus_axis = "nul"
input_l_y_minus_axis = "nul"
input_r_x_plus_axis = "nul"
input_r_x_minus_axis = "nul"
input_r_y_plus_axis = "nul"
input_r_y_minus_axis = "nul"
