# Core options for brick9000's RetroArch, copied to
# ~/.config/retroarch/brick-core-options.cfg by install.sh (retroarch.cfg
# points there). RetroArch writes other options back into that copy; this
# file wins on every install.

# PCSX-ReARMed (PlayStation): render at twice the PS1's resolution (its NEON
# GPU's "enhanced resolution"); RetroArch scales the picture to the full
# screen as before. Measured on brick9000 (2026-10-14): 4.5-8x full speed,
# 3.4x with crt-pi on top in the heaviest games tested.
pcsx_rearmed_neon_enhancement_enable = "enabled"
