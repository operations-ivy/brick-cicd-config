# Caddy on brick9000's port 80, routing by name (see Caddyfile). Host
# networking, so it reaches Jenkins and brick-status on localhost.
#   ~/brick-cicd-config/brick9000/proxy/up
name: brick-proxy
services:
  caddy:
    image: caddy:2.11.4-alpine
    container_name: brick-proxy
    restart: unless-stopped
    network_mode: host
    volumes:
      # The directory, not the file: git replaces Caddyfile on checkout, and a
      # single-file bind mount keeps showing the container the old one.
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
    logging:
      driver: journald
      options:
        tag: brick-proxy
volumes:
  caddy-data:
