# Jenkins on brick9000, at https://jenkins.brick.nozdormu.cloud through the proxy
# (brick9000/proxy); it listens only on localhost itself. Started by install.sh
# and kept current by deploy; Docker restarts it on boot.
#   docker compose -f ~/brick-cicd-config/brick9000/jenkins/compose.yaml up -d --build
# Logs: journalctl CONTAINER_NAME=brick-jenkins
name: brick-jenkins
services:
  jenkins:
    build: .
    image: brick-jenkins:local
    container_name: brick-jenkins
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Lets deploy reload the configuration (and so the jobs) after a git pull.
      CASC_RELOAD_TOKEN: ${CASC_RELOAD_TOKEN:?run brick9000/jenkins/setup first}
    # The host's docker group, for the socket below (image pruning, later builds).
    group_add:
      - "${DOCKER_GID:-984}"
    volumes:
      - ${HOME}/.local/share/brick-jenkins:/var/jenkins_home
      - ${HOME}/brick-cicd-config:/brick-cicd-config:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Docker Hub login (prune_images.py reads it; builds will push with it).
      - ${HOME}/.docker/config.json:/var/jenkins_home/.docker/config.json:ro
    secrets:
      - admin_password
      - brick_status_password
      - webhook_secret
      - source: ssh_key
        target: /var/jenkins_home/.ssh/id_ed25519
    logging:
      driver: journald
      options:
        tag: brick-jenkins

# Generated once by brick9000/jenkins/setup; never in git.
secrets:
  admin_password:
    file: ${HOME}/.config/brick-jenkins/secrets/admin_password
  brick_status_password:
    file: ${HOME}/.config/brick-jenkins/secrets/brick_status_password
  webhook_secret:
    file: ${HOME}/.config/brick-jenkins/secrets/webhook_secret
  ssh_key:
    file: ${HOME}/.config/brick-jenkins/secrets/ssh_key
