controller:
  # On the NVMe worker like Loki/Tempo/Prometheus: JENKINS_HOME churns
  # (build logs, workspaces, plugin updates), which wears SD cards out.
  nodeSelector:
    chuck.io/storage-node: "true"
  # Builds run in agent pods, never on the controller itself.
  numExecutors: 0
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi
  # Keep the heap well under the 2Gi limit, leaving room for metaspace and
  # thread stacks so the JVM isn't OOM-killed.
  javaOpts: "-Xms512m -Xmx1280m"
  jenkinsUrl: http://jenkins.local
  # A ServiceMonitor, which Prometheus picks up from any namespace.
  # brick-status reads build status from these metrics.
  prometheus:
    enabled: true
  # Despite the chart's values comment, prometheus.enabled does not install
  # the plugin that serves /prometheus; it has to be listed here.
  additionalPlugins:
    - prometheus
  # admin.password is left unset, so the chart generates a random one into the
  # `jenkins` Secret. See the README for how to read it back.

agent:
  # Build pods also go on brick2000: more RAM, and workspaces on the NVMe.
  nodeSelector:
    chuck.io/storage-node: "true"

persistence:
  size: 20Gi
