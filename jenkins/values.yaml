# Helm values for the cluster's Jenkins: the jenkinsci/jenkins chart, release
# "jenkins" in the jenkins namespace. Argo CD deploys it from main
# (brick-k8s-config's argocd/apps/jenkins.yaml pins the chart); jenkins/release
# builds the image tag below before the merge and checks the jobs after.
#
# Served at https://jenkins.brick.nozdormu.cloud: brick9000's proxy sends the
# name to Traefik, which routes it to the Ingress below.

controller:
  # Our image (Dockerfile): plugins, tools, jobs and their scripts all baked
  # in, so a start never needs the internet and the tag says exactly what
  # runs. The tag is worked out from the image's files, never picked:
  # after any change under jenkins/, run jenkins/image-tag --write (the tests
  # fail until you do). build-branches builds it from the pushed branch and
  # marks the commit on GitHub; merge once that check is green. The build
  # passes it to the Dockerfile as BRICK_JENKINS_TAG, which stamps it into the
  # agent pods (lib/build.groovy's tools, test-brick-cicd-config) where
  # @BRICK_JENKINS_TAG@ stands in.
  image:
    registry: docker.io
    repository: whitepatrick/brick-jenkins
    tag: "2.580.1-f6785cd33b3d"
    pullPolicy: IfNotPresent
  # The chart's own plugin download would need the internet on every start;
  # the image has them instead. overwritePlugins clears the home's plugins on
  # each start so the image's set (and versions) is exactly what loads.
  installPlugins: false
  overwritePlugins: true

  # On the NVMe worker like Loki/Tempo/Prometheus: JENKINS_HOME churns
  # (build logs, workspaces, repo mirrors), which wears SD cards out.
  nodeSelector:
    chuck.io/storage-node: "true"
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi
  # Keep the heap well under the 2Gi limit, leaving room for metaspace and
  # thread stacks so the JVM isn't OOM-killed.
  javaOpts: "-Xms512m -Xmx1280m"
  # A Pi takes a while to unpack the war and load plugins: allow 5 minutes.
  probes:
    startupProbe:
      failureThreshold: 30

  # The maintenance jobs run on the controller itself, where the tools and the
  # Secret are, and only those that ask for the built-in node: EXCLUSIVE keeps
  # anything else (build and test jobs) on agent pods.
  numExecutors: 2
  executorMode: EXCLUSIVE

  jenkinsUrl: https://jenkins.brick.nozdormu.cloud/
  ingress:
    enabled: true
    ingressClassName: traefik
    hostName: jenkins.brick.nozdormu.cloud
    path: /
    pathType: Prefix

  # A ServiceMonitor, which Prometheus picks up from any namespace. Its job
  # label is "jenkins", as when Prometheus scraped brick9000's Jenkins, so the
  # history carries on.
  prometheus:
    enabled: true

  # Every key of the brick-jenkins Secret (a SealedSecret in
  # brick-k8s-secrets, made by jenkins/seal-secrets) is a file in
  # /run/secrets/additional: ${<key>} below, and read by seed.groovy and the
  # job scripts.
  existingSecret: brick-jenkins
  admin:
    createSecret: false

  # The config-reload sidecar is an extra image to pull from the internet;
  # without it, the configuration below applies when the pod restarts, which
  # every helm upgrade that changes it does.
  sidecars:
    configAutoReload:
      enabled: false

  JCasC:
    securityRealm: |-
      local:
        allowsSignup: false
        users:
          - id: admin
            password: "${admin-password}"
          # Read-only: brick-status polls job state for the board.
          - id: brick-status
            password: "${brick-status-password}"
    authorizationStrategy: |-
      globalMatrix:
        entries:
          - user:
              name: admin
              permissions:
                - Overall/Administer
          - user:
              name: brick-status
              permissions:
                - Overall/Read
                - Job/Read
    configScripts:
      brick: |
        jenkins:
          systemMessage: >-
            Jenkins for the brick homelab, on the cluster. Configured from
            brick-cicd-config/jenkins; changes made here are overwritten.
        security:
          # The seed script is ours, from the image; it reads the job files.
          globalJobDslSecurityConfiguration:
            useScriptSecurity: false
        jobs:
          - file: /usr/share/brick-jenkins/seed.groovy
        # Docker Hub, for build-image's pushes (lib/build.groovy), from the
        # brick-jenkins Secret's dockerhub-username and dockerhub-token.
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      scope: GLOBAL
                      id: dockerhub
                      description: Docker Hub, for build-image pushes
                      username: "${dockerhub-username}"
                      password: "${dockerhub-token}"

agent:
  # Build and test pods also go on brick2000: more RAM, and workspaces on the
  # NVMe. Only jobs that ask for an agent label get one (EXCLUSIVE).
  nodeSelector:
    chuck.io/storage-node: "true"
  nodeUsageMode: EXCLUSIVE
  # Their own namespace (namespace.yaml), where the jenkins ServiceAccount may
  # only manage pods (the chart's schedule-agents Role). Test jobs run each
  # repo's code: their pods run as serviceAccountAgent below, with no token,
  # so that code can't reach the cluster's API as anyone.
  namespace: jenkins-agents

serviceAccountAgent:
  create: true
  automountServiceAccountToken: false

persistence:
  size: 20Gi
  # JENKINS_HOME: Argo CD never prunes or deletes it (brick-k8s-config#42).
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false

# What the maintenance jobs do to the cluster, as the jenkins ServiceAccount:
# wigle-sync-now and chuck-importer each start a Job from a (suspended, for
# the importer) CronJob, overriding its parameters. Both wait and read logs.
extraObjects:
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: jenkins-jobs
      namespace: wigle
    rules:
      - apiGroups: [batch]
        resources: [cronjobs]
        verbs: [get]
      - apiGroups: [batch]
        resources: [jobs]
        verbs: [get, list, watch, create]
      - apiGroups: [""]
        resources: [pods, pods/log]
        verbs: [get, list, watch]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: jenkins-jobs
      namespace: wigle
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: jenkins-jobs
    subjects:
      - kind: ServiceAccount
        name: jenkins
        namespace: jenkins
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: jenkins-jobs
      namespace: chuck
    rules:
      - apiGroups: [batch]
        resources: [cronjobs]
        verbs: [get]
      - apiGroups: [batch]
        resources: [jobs]
        verbs: [get, list, watch, create, patch, delete]
      - apiGroups: [""]
        resources: [pods, pods/log]
        verbs: [get, list, watch]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: jenkins-jobs
      namespace: chuck
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: jenkins-jobs
    subjects:
      - kind: ServiceAccount
        name: jenkins
        namespace: jenkins
  # After every Argo CD sync: check every job file in this image is a job in
  # Jenkins, and restart it once if not (jenkins/release --check's work, so a
  # merge needs nothing from the laptop). seed-after-load.groovy should make
  # the restart rare. It runs in the image Argo just deployed (the tag below),
  # so it expects exactly that image's jobs. It may read pods here and delete
  # only jenkins-0; a failure shows as the jenkins app's sync failing.
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: jenkins-check-jobs
      namespace: jenkins
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: jenkins-check-jobs
      namespace: jenkins
    rules:
      - apiGroups: [""]
        resources: [pods]
        verbs: [get, list, watch]
      - apiGroups: [""]
        resources: [pods]
        resourceNames: [jenkins-0]
        verbs: [delete]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: jenkins-check-jobs
      namespace: jenkins
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: jenkins-check-jobs
    subjects:
      - kind: ServiceAccount
        name: jenkins-check-jobs
        namespace: jenkins
  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: jenkins-check-jobs
      namespace: jenkins
      annotations:
        argocd.argoproj.io/hook: PostSync
        # The last run stays (for its log) until the next sync replaces it.
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        spec:
          serviceAccountName: jenkins-check-jobs
          restartPolicy: Never
          # Where the controller runs: its image is already there.
          nodeSelector:
            chuck.io/storage-node: "true"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: check
              image: "{{ .Values.controller.image.registry }}/{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag }}"
              command: [sh, -c]
              args:
                - |
                  set -eu
                  p=$(cat /run/secrets/brick-jenkins/admin-password)
                  missing() {  # job files of this image that Jenkins doesn't list
                      live=
                      for i in $(seq 1 60); do
                          live=$(curl -sf -g -u "admin:$p" "http://jenkins:8080/api/json?tree=jobs[name]") && break
                          sleep 5
                      done
                      [ -n "$live" ] || { echo "check-jobs: Jenkins didn't answer in 5 minutes" >&2; return 2; }
                      for f in /usr/share/brick-jenkins/jobs/*.groovy; do
                          n=$(basename "$f" .groovy)
                          case "$live" in *"\"name\":\"$n\""*) ;; *) echo "$n" ;; esac
                      done
                  }
                  gone=$(missing)
                  if [ -z "$gone" ]; then echo "check-jobs: every job is loaded"; exit 0; fi
                  echo "check-jobs: not loaded: $(echo $gone); restarting Jenkins once"
                  old=$(kubectl -n jenkins get pod jenkins-0 -o jsonpath='{.metadata.uid}')
                  kubectl -n jenkins delete pod jenkins-0 --wait=true
                  # The StatefulSet makes a new pod; wait for that one, not the old.
                  for i in $(seq 1 120); do
                      new=$(kubectl -n jenkins get pod jenkins-0 -o jsonpath='{.metadata.uid}' 2>/dev/null || true)
                      [ -n "$new" ] && [ "$new" != "$old" ] && break
                      sleep 5
                  done
                  kubectl -n jenkins wait --for=condition=Ready pod/jenkins-0 --timeout=15m
                  gone=$(missing)
                  if [ -n "$gone" ]; then echo "check-jobs: still not loaded after a restart: $(echo $gone)" >&2; exit 1; fi
                  echo "check-jobs: every job is loaded after one restart"
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {cpu: 200m, memory: 128Mi}
              volumeMounts:
                - {name: brick-jenkins, mountPath: /run/secrets/brick-jenkins, readOnly: true}
          volumes:
            - name: brick-jenkins
              secret:
                secretName: brick-jenkins
                items:
                  - {key: admin-password, path: admin-password}
