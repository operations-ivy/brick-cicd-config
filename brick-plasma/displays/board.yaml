# brick-status: the board's own health and quiet hours (lights.idle_pattern).
defaults:
  priority: 10

displays:
  alert:
    effect: pulse
    color: "#ff0000"
    seconds: 1.0
    low: 0.15

  building:
    effect: chase
    color: "#ff8c00"
    seconds: 1.5

  uploading:
    effect: pulse
    color: "#00ff00"
    seconds: 2.0
    low: 0.1

  warn:
    effect: pulse
    color: "#ff8c00"
    seconds: 3.0
    low: 0.05
    high: 0.6

  unknown:
    effect: pulse
    color: "#5a5a6e"
    seconds: 4.0
    low: 0.05
    high: 0.4

  calm:
    effect: pulse
    color: "#00ff00"
    seconds: 6.0
    low: 0.03

  # Over a build's stages: Jenkins' nightly test-all, for the minutes it runs.
  nightly:
    effect: nightly
    seconds: 8.0
    priority: 60

  # Quiet hours: nothing else gets through.
  "off":
    effect: solid
    color: "#000000"
    priority: 100

  # Answers to the front-right button (brick_status/check.py), from the
  # "board-button" sender: over everything but quiet hours, for a moment.
  check-armed:
    effect: flash
    color: "#ffffff"
    seconds: 0.5
    priority: 90
    ttl: 1.5

  check-started:
    effect: stream
    color: "#00c8ff"
    seconds: 1.0
    priority: 90
    ttl: 3

  check-unreachable:
    effect: pulse
    color: "#ff8c00"
    seconds: 0.6
    low: 0.0
    priority: 90
    ttl: 5

  # Answers to the front-left button (brick_status/lamp.py), the Hue lamp:
  # "board-button" sender, over everything but quiet hours, for a moment.
  # lamp-scene-N is lamp.yaml's Nth scene.
  lamp-on:
    effect: rush
    color: "#ffb46b"
    seconds: 0.8
    priority: 90
    ttl: 1.5

  lamp-off:
    effect: converge
    color: "#40281a"
    seconds: 0.8
    priority: 90
    ttl: 1.5

  lamp-scene-1:
    effect: flash
    color: "#ffe6c8"
    seconds: 0.6
    priority: 90
    ttl: 1.5

  lamp-scene-2:
    effect: flash
    color: "#ff8c32"
    seconds: 0.6
    priority: 90
    ttl: 1.5

  # hacker: green scanlines across the cabinet.
  lamp-scene-3:
    effect: scanner
    color: "#00ff41"
    seconds: 1.0
    priority: 90
    ttl: 2

  lamp-night:
    effect: pulse
    color: "#ff5000"
    seconds: 2.0
    low: 0.0
    high: 0.5
    priority: 90
    ttl: 2

  lamp-unreachable:
    effect: pulse
    color: "#ff8c00"
    seconds: 0.6
    low: 0.0
    priority: 90
    ttl: 5
