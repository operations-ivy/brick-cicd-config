# Deploys and image builds on brick9000 itself (brick9000/build-status.sh).
[defaults]
priority = 80

[displays.deploying]
effect = "boil"
seconds = 2.0

[displays.image-building]
effect = "rainbow"
seconds = 0.75

[displays.image-pushed]
effect = "flash"
color = "#00ff00"
seconds = 0.5

[displays.image-failed]
effect = "pulse"
color = "#ff0000"
seconds = 0.8
low = 0.0
