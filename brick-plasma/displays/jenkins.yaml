# Jenkins build stages, from plasma('<kind>') { ... } (jenkins/lib/plasma.groovy).
# Over the board's health: the lights show what's happening now.
defaults:
  priority: 50

displays:
  stage-checkout:
    effect: stream
    color: "#00c8ff"
    seconds: 1.5

  stage-install:
    effect: fill
    color: "#ff8c00"
    seconds: 2.0

  stage-test:
    effect: scanner
    color: "#00ff00"
    seconds: 1.6

  stage-verify:
    effect: converge
    color: "#aa3cff"
    seconds: 1.6

  stage-build:
    effect: rainbow
    seconds: 0.75

  stage-push:
    effect: rush
    color: "#285aff"
    seconds: 1.0

  stage-deploy:
    effect: boil
    seconds: 2.0

  # check-all's result (plasmaResult): over the nightly pattern its test-all
  # run shows, under the view buttons.
  check-passed:
    effect: pulse
    color: "#00ff00"
    seconds: 1.0
    low: 0.3
    priority: 65
    ttl: 30

  check-failed:
    effect: pulse
    color: "#ff0000"
    seconds: 0.8
    low: 0.0
    priority: 65
    ttl: 300
