<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brick-status</title>
<link rel="stylesheet" href="/static/vendor/xterm.css">
<style>
  /* The redesign candidate (brick-cicd-config#45): one screen, laid out by what
     the cluster's metrics, logs and traces show gets used (2026-11-07): the lamp
     and the speaker first, then the Jenkins work that matters, and health only
     as exceptions. Hackery / cyberpunk / pixel: VT323 (OFL, vendored), neon on
     black, a raster over everything. */
  @font-face { font-family: "VT323"; font-weight: 400; src: url(/static/vendor/fonts/vt323-400.woff2) format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url(/static/vendor/fonts/ibm-plex-mono-400.woff2) format("woff2"); }

  :root {
    --void: #04050a;
    --panel: #0a0e19;
    --edge: #1a2442;
    --grid: #0e1630;
    --text: #c9f3ff;
    --dim: #5b7799;
    --cyan: #00eaff;
    --magenta: #ff2bd6;
    --green: #39ff6a;
    --amber: #ffb300;
    --red: #ff3355;
    --slate: #6c7c95;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--void); color: var(--text); overflow: hidden; cursor: none; }
  body.mirror { cursor: auto; }  /* status.brick.nozdormu.cloud, viewed from another machine */
  body {
    font-family: "VT323", "DejaVu Sans Mono", monospace; font-size: 2.55vw; line-height: 1.05;
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 2.2em 2.2em;
  }
  /* The raster: scanlines and a slow roll over the whole screen. */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 10;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.28) 0 1px, transparent 1px 3px),
                radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
  }
  body::before {
    content: ""; position: fixed; left: 0; right: 0; height: 18vh; z-index: 11; pointer-events: none;
    background: linear-gradient(to bottom, transparent, rgba(0,234,255,0.035), transparent);
    animation: roll 9s linear infinite;
  }
  @keyframes roll { from { top: -20vh; } to { top: 110vh; } }

  .ok { --s: var(--green); } .warn { --s: var(--amber); } .fail { --s: var(--red); }
  .active { --s: var(--cyan); } .unknown { --s: var(--slate); }
  .glow { text-shadow: 0 0 0.25em currentColor; }

  /* Header: the wordmark, then the one-line summary. */
  header { display: flex; align-items: baseline; gap: 0.7em; padding: 0.25em 0.8em 0.2em;
           border-bottom: 2px solid var(--edge); background: rgba(4,5,10,0.85); white-space: nowrap; overflow: hidden; min-width: 0; }
  .logo { font-size: 1.7em; color: var(--cyan); letter-spacing: 0.04em; position: relative;
          text-shadow: 0.06em 0 var(--magenta), -0.06em 0 var(--cyan), 0 0 0.3em var(--cyan); }
  .logo b { color: var(--magenta); font-weight: 400; }
  body.alarm .logo { animation: glitch 2.4s steps(1) infinite; }
  @keyframes glitch { 0%, 92% { transform: none; } 93% { transform: translateX(0.08em) skewX(-8deg); }
                      95% { transform: translateX(-0.06em); clip-path: inset(30% 0 40% 0); } 97% { transform: none; } }
  .summary { display: flex; gap: 0.45em; font-size: 0.95em; overflow: hidden; min-width: 0; }
  .summary span { color: var(--s, var(--dim)); }
  .summary span + span::before { content: "//"; color: var(--edge); margin-right: 0.55em; }
  header .spacer { flex: 1; }
  .pill { font-size: 0.9em; color: var(--s); border: 1px solid var(--s); padding: 0 0.35em; }
  .pill[hidden] { display: none; }
  .fresh { font-size: 0.8em; color: var(--dim); }
  .fresh.stale { color: var(--amber); }
  .clock { font-size: 1.35em; color: var(--magenta); text-shadow: 0 0 0.3em var(--magenta); }

  main { min-height: 0; padding: 0.55em 0.8em; display: grid; gap: 0.55em;
         grid-template-columns: 21vw minmax(0, 1fr) minmax(0, 1.3fr); grid-template-rows: minmax(0, 1fr) auto; }

  /* Panels: a pixel frame with bracket corners and a tab for the title. */
  .panel { position: relative; background: var(--panel); border: 2px solid var(--edge); padding: 1.05em 0.6em 0.45em;
           min-height: 0; overflow: hidden; }
  .panel::before, .panel::after { content: ""; position: absolute; width: 0.6em; height: 0.6em; border: 2px solid var(--s, var(--cyan)); }
  .panel::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .panel::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }
  .panel > h2 { position: absolute; top: 0; left: 0.6em; font-size: 0.85em; font-weight: 400; letter-spacing: 0.12em;
                color: var(--void); background: var(--s, var(--cyan)); padding: 0 0.35em; line-height: 1.05; }
  .panel.fail { animation: alarm 1.1s steps(2, jump-none) infinite; }
  @keyframes alarm { 50% { border-color: var(--red); } }
  .col { display: grid; gap: 0.55em; min-height: 0; }
  .mid { grid-template-rows: auto auto minmax(0, 1fr); }
  .right { grid-template-rows: minmax(0, 1fr) auto; }
  .right.detail { grid-template-rows: minmax(0, 1fr); }

  /* Segment bars: the pixel meter used by the lamp, the speaker and the nodes. */
  .bar { display: grid; grid-template-columns: repeat(var(--n, 10), 1fr); gap: 0.12em; height: 0.75em; }
  .bar i { background: var(--edge); }
  .bar i.on { background: var(--s); box-shadow: 0 0 0.3em var(--s); }

  /* The lamp: the board's most pressed button (69 presses a week). */
  /* Lamp and speaker: one line each (the user, 2026-11-07: half the size). */
  #lamp-panel, #vol-panel { padding-bottom: 0.3em; }
  /* No picture: the bar glows in the lamp's own colour (warm amber to cool white). */
  .lamp { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 0.5em; align-items: center; }
  .big { font-size: 1.1em; line-height: 1; color: var(--s); white-space: nowrap; }
  #lamp .bar, #vol .bar { height: 0.45em; }
  .small { font-size: 0.78em; color: var(--dim); }

  /* The speaker: the volume page is the most used page after Prometheus. */
  .vol { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 0.5em; align-items: center; }
  .vol.muted .big { animation: blink 1s steps(2, jump-none) infinite; }
  .keys { display: flex; gap: 0.5em; font-size: 0.78em; color: var(--dim); }
  .keys b { color: var(--cyan); font-weight: 400; border: 1px solid var(--edge); padding: 0 0.25em; }

  /* Lists: the pipeline, anomalies, and the detail screens. */
  .list { display: grid; gap: 0.08em; align-content: start; }
  .item { display: grid; grid-template-columns: 0.8em minmax(0, 1fr) auto; gap: 0.45em; align-items: center; }
  .item .led { width: 0.6em; height: 0.6em; background: var(--s); box-shadow: 0 0 0.35em var(--s); }
  .item.fail .led, .item.fail .what { animation: blink 0.9s steps(2, jump-none) infinite; }
  .item.active .led { animation: pulse 1.2s ease-in-out infinite; }
  .item .name { font-size: 1.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .what { font-size: 0.95em; color: var(--s); white-space: nowrap; }
  .item.ok .what { color: var(--dim); }
  .pips { display: inline-flex; gap: 0.12em; margin-left: 0.4em; vertical-align: middle; }
  .pips i { width: 0.45em; height: 0.45em; background: var(--s); }
  .note { font-size: 0.85em; color: var(--dim); margin-top: 0.2em; }
  .heading { font-size: 0.85em; color: var(--magenta); letter-spacing: 0.12em; margin-top: 0.25em; }
  .clear { font-size: 1.4em; color: var(--green); }
  .clear::after { content: "_"; animation: blink 1s steps(2, jump-none) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 50% { opacity: 0.25; } }

  /* The CRT: one column down the left, as #45 asked. */
  .crt { grid-row: 1; grid-column: 1; padding: 1.05em 0.35em 1.4em; --s: var(--magenta); }
  .crt .glass { position: relative; height: 100%; background: #020306; overflow: hidden; border: 1px solid var(--edge); }
  .crt .glass::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.3) 0 1px, transparent 1px 3px); }
  .crt #term { position: absolute; inset: 0.3em; }
  .crt { --split: 45%; }
  .crt #term-log { display: none; position: absolute; left: 0.3em; right: 0.3em; bottom: 0.3em;
    top: calc(var(--split) + 0.3em); border-top: 1px solid var(--edge); }
  .crt.split #term { bottom: auto; height: calc(var(--split) - 0.3em); }
  .crt.split #term-log { display: block; }
  .crt .xterm-viewport { background: transparent !important; overflow: hidden !important; }
  .crt .label { position: absolute; left: 0.5em; right: 0.5em; bottom: 0.15em; font-size: 0.85em; color: var(--s);
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crt.ok { --s: var(--green); } .crt.warn { --s: var(--amber); } .crt.fail { --s: var(--red); }
  .crt, .crt * { cursor: none !important; }

  /* The nodes: a strip along the bottom, smaller than before (#45). */
  .nodes { grid-column: 1 / -1; grid-row: 2; display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
           gap: 0.9em; padding: 0.95em 0.6em 0.35em; --s: var(--cyan); }
  .node { display: grid; grid-template-columns: auto 1fr auto; gap: 0.05em 0.35em; align-items: center; font-size: 0.85em; min-width: 0; }
  .node .host { grid-column: 1 / -1; font-size: 1.15em; color: var(--s); white-space: nowrap; }
  .node .host::before { content: "> "; color: var(--magenta); }
  .node .k { color: var(--dim); }
  .node .v { color: var(--dim); text-align: right; min-width: 2.6em; }
  .node .bar { --n: 8; height: 0.5em; }
  .node.warn .host, .node.fail .host { animation: blink 1s steps(2, jump-none) infinite; }

  /* Footer: the six buttons and the three around the cabinet. */
  footer { display: flex; align-items: center; gap: 1.2em; padding: 0.2em 0.8em 0.3em; border-top: 2px solid var(--edge);
           background: rgba(4,5,10,0.85); font-size: 0.85em; overflow: hidden; min-width: 0; }
  .pad { display: grid; grid-template-columns: repeat(3, auto); gap: 0.05em 0.9em; }
  .pad span { color: var(--dim); white-space: nowrap; }
  .pad span::before { content: attr(data-n) " "; color: var(--edge); }
  .pad span.on { color: var(--cyan); text-shadow: 0 0 0.3em var(--cyan); }
  .pad span.on::before { color: var(--magenta); }
  footer .hint { color: var(--dim); margin-left: auto; text-align: right; line-height: 1.15; }
  footer .hint b { color: var(--amber); font-weight: 400; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<header>
  <span class="logo">BRICK<b>//</b>NET</span>
  <span class="summary" id="summary"></span>
  <span class="spacer"></span>
  <span class="pill unknown" id="display-off" hidden>DISPLAY OFF</span>
  <span class="pill ok" id="awake" hidden></span>
  <span class="pill warn" id="internet" hidden>NET DOWN</span>
  <span class="pill fail" id="sshd" hidden>SSHD DOWN</span>
  <span class="fresh" id="fresh"></span>
  <span class="clock" id="clock"></span>
</header>
<main>
  <div class="crt panel" id="crt"><h2>CRT</h2><div class="glass"><div id="term"></div><div id="term-log"></div></div><div class="label" id="crt-label"></div></div>
  <div class="col mid">
    <div class="panel" id="lamp-panel"><h2>LAMP</h2><div id="lamp"></div></div>
    <div class="panel" id="vol-panel"><h2>SPEAKER</h2><div id="vol"></div></div>
    <div class="panel" id="deploy-panel"><h2>LAST DEPLOY</h2><div id="deploy"></div></div>
  </div>
  <div class="col right" id="right">
    <div class="panel" id="main-panel"><h2 id="main-title">PIPELINE</h2><div id="main-list"></div></div>
    <div class="panel" id="anomaly-panel"><h2>ANOMALIES</h2><div id="anomalies"></div></div>
  </div>
  <div class="nodes panel" id="nodes-panel"><h2>NODES</h2></div>
</main>
<footer>
  <div class="pad" id="pad"></div>
  <div class="hint"><b>LAMP</b> tap · 2×: scene · hold: night &nbsp; <b>1UP</b> 2×: check all<br>
    <b>SIDE</b> sleep / wake &nbsp; <b>STICK</b> ← → screens</div>
</footer>

<script src="/static/vendor/xterm.js"></script>
<script src="/static/vendor/addon-fit.js"></script>
<script src="/static/vendor/addon-webgl.js"></script>
<script>
const SEVERITY = ["fail", "warn", "unknown", "active", "ok"];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const bySeverity = (a, b) => SEVERITY.indexOf(a.state) - SEVERITY.indexOf(b.state);
const worst = states => SEVERITY.find(s => states.includes(s)) || "ok";
const WORD = { ok: "OK", warn: "WARN", fail: "FAIL", active: "RUN", unknown: "??" };

// The six front-panel buttons (config.BUTTON_ACTIONS): screens on top, the speaker below.
const PAD = [["overview", "HOME"], ["builds", "PIPELINE"], ["cluster", "CLUSTER"],
             ["volume-down", "VOL −"], ["volume-up", "VOL +"], ["mute", "MUTE"]];

// The Jenkins jobs that are work, not housekeeping: build-branches and
// maintenance-refresh alone are 2,900 of the week's 3,000 builds (2026-11-07).
const WORK = ["build-image", "check-all", "verify-images", "deploy-brick9000", "deploy-brick1982",
              "prune-images", "wigle-sync-now", "chuck-importer"];
const segs = (n, lit) => Array.from({ length: n }, (_, i) => `<i${i < lit ? ' class="on"' : ""}></i>`).join("");
const item = (state, name, what, extra = "") =>
  `<div class="item ${state}"><span class="led"></span><span class="name">${esc(name)}${extra}</span>
   <span class="what">${esc(what)}</span></div>`;

function pipeline(builds) {
  if (!builds) return `<div class="note">no data from Jenkins</div>`;
  const checks = builds.checks;
  const by = Object.fromEntries(checks.map(c => [c.name, c]));
  const tests = checks.filter(c => c.name.startsWith("test-") && c.name !== "test-all");
  const rows = [];
  // Running first, then failing, then the rest of the work in its usual order.
  const work = WORK.filter(n => by[n]).map(n => by[n]).sort(bySeverity);
  for (const c of work) rows.push(item(c.state, c.name, c.state === "active" ? (c.stage || "running") : c.detail));
  if (tests.length) {
    const st = worst(tests.map(t => t.state));
    const pips = `<span class="pips">${tests.map(t => `<i class="${t.state}" style="background:var(--s)"></i>`).join("")}</span>`;
    const passing = tests.filter(t => t.state === "ok").length;
    const all = by["test-all"];
    rows.push(item(st, "tests", `${passing}/${tests.length} · ${all ? all.detail : ""}`, pips));
  }
  const chores = checks.filter(c => !WORK.includes(c.name) && !c.name.startsWith("test-"));
  const choreState = worst(chores.map(c => c.state));
  const okChores = chores.filter(c => c.state === "ok").length;
  rows.push(item(choreState, "housekeeping", `${okChores}/${chores.length}`));
  return `<div class="list">${rows.join("")}</div>`;
}

// Everything that isn't fine, from every source, worst first. Empty is the usual case.
function anomalies(s) {
  const out = [];
  for (const [group, g] of Object.entries(s.groups || {}))
    for (const c of g.checks) if (c.state === "fail" || c.state === "warn" || c.state === "unknown")
      out.push({ state: c.state, name: `${group}/${c.name}`, what: c.detail });
  if (s.host?.internet === false) out.push({ state: "warn", name: "internet", what: "down" });
  if (s.host?.sshd === false) out.push({ state: "fail", name: "brick9000/sshd", what: "down" });
  for (const n of s.vitals || []) {
    const t = n.temp, d = n.disk;
    if (t >= 70) out.push({ state: t >= 80 ? "fail" : "warn", name: `${n.node}/temp`, what: `${Math.round(t)}°C` });
    if (d >= 85) out.push({ state: d >= 95 ? "fail" : "warn", name: `${n.node}/disk`, what: `${Math.round(d)}%` });
  }
  if (!out.length) return `<div class="clear">&gt; all clear</div>`;
  return `<div class="list">${out.sort(bySeverity).slice(0, 7).map(a => item(a.state, a.name, a.what)).join("")}</div>`;
}

// The detail screens (buttons 2 and 3): every check of their groups.
function detail(s, groups) {
  return `<div class="list">${groups.map(([title, name]) => {
    const g = s.groups?.[name];
    const rows = g ? [...g.checks].sort(bySeverity).map(c => item(c.state, c.name, c.detail)).join("")
                   : `<div class="note">no data</div>`;
    return `<div class="heading">${title}</div>${rows}`;
  }).join("")}</div>`;
}

// Warm to cool: a 2000 K lamp glows amber, 6500 K near white.
function lampColour(k) {
  if (!k) return "var(--amber)";
  const t = Math.max(0, Math.min(1, (k - 2000) / 4500));
  const mix = (a, b) => Math.round(a + (b - a) * t);
  return `rgb(${mix(255, 220)}, ${mix(170, 240)}, ${mix(40, 255)})`;
}

function lampPanel(l) {
  if (!l) return `<div class="lamp"><div class="big" style="--s:var(--slate)">OFFLINE</div>
                  <span class="small">no answer from Home Assistant</span></div>`;
  const pct = l.on ? (l.brightness_pct ?? 100) : 0;
  const kelvin = l.kelvin ? `${l.kelvin} K` : "";
  return `<div class="lamp ${l.on ? "on" : ""}">
    <div class="big glow" style="--s:${l.on ? "var(--amber)" : "var(--dim)"}">${l.on ? "ON " + pct + "%" : "OFF"}</div>
    <div class="bar" style="--s:${lampColour(l.kelvin)}">${segs(10, Math.ceil(pct / 10))}</div>
    <span class="small">${kelvin}</span></div>`;
}

let vol = null;
function volPanel() {
  if (!vol) return `<div class="note">no answer from the speaker</div>`;
  const pct = Math.round(vol.level * 100);
  return `<div class="vol ${vol.muted ? "muted" : ""}">
    <span class="big glow" style="--s:${vol.muted ? "var(--red)" : "var(--cyan)"}">${vol.muted ? "MUTED" : pct + "%"}</span>
    <div class="bar" style="--s:${vol.muted ? "var(--slate)" : "var(--cyan)"}">${segs(10, Math.round(pct / 10))}</div>
    <span class="keys"><b>4</b>− <b>5</b>+ <b>6</b>mute</span></div>`;
}
async function pollVolume() {
  try { vol = await (await fetch("/api/volume", { cache: "no-store" })).json(); } catch (e) { vol = null; }
  setHTML("vol", volPanel());
}

function deployPanel(argo) {
  if (!argo) return `<div class="note">no data from Argo CD</div>`;
  const apps = argo.checks.find(c => c.name === "apps");
  const synced = argo.checks.filter(c => c.name.startsWith("synced "));
  const rows = synced.map(c => item(c.state, c.name.replace(/^synced /, ""), c.detail.replace(/^succeeded, /, "")));
  if (apps) rows.push(item(apps.state, "apps", apps.detail.split(" ")[0]));
  return `<div class="list">${rows.join("")}</div>`;
}

function summary(s) {
  const g = s.groups || {};
  const all = Object.values(g).flatMap(x => x.checks);
  const failing = all.filter(c => c.state === "fail").length;
  const work = all.find(c => c.group === "cluster" && c.name === "workloads");
  const nodes = (g.cluster?.checks || []).filter(c => /^brick/.test(c.name));
  const ready = nodes.filter(c => c.detail === "Ready").length;
  const apps = (g.argocd?.checks || []).find(c => c.name === "apps");
  const running = (g.builds?.checks || []).find(c => c.state === "active");
  const parts = [
    `<span class="${s.overall || "unknown"} glow">${{ ok: "ALL NOMINAL", warn: "DEGRADED", fail: "ALERT", unknown: "NO DATA" }[s.overall] || "NO DATA"}</span>`,
    `<span class="${worst(nodes.map(n => n.state))}">nodes ${ready}/${nodes.filter(n => !/maintenance/.test(n.detail)).length}</span>`,
    work && work.state !== "ok" ? `<span class="${work.state}">pods ${esc(work.detail)}</span>` : "",
    apps ? `<span class="${apps.state}">argo ${esc(apps.detail.split(" ")[0])}</span>` : "",
    `<span class="${failing ? "fail" : "ok"}">${failing} failing</span>`,
    running ? `<span class="active">▶ ${esc(running.name)}</span>` : "",
  ];
  return parts.join("");
}

// Node vitals: [label, warn, fail, full scale], in °C here (the old page showed °F).
const LEVELS = { cpu: ["CPU", 85, 95, 100], mem: ["MEM", 85, 95, 100], temp: ["TMP", 70, 80, 85] };
function level(k, v) {
  if (v === undefined || v === null) return { state: "unknown", pct: 0 };
  const [, warn, fail, full] = LEVELS[k];
  return { state: v >= fail ? "fail" : v >= warn ? "warn" : "ok", pct: Math.max(0, Math.min(100, v / full * 100)) };
}
function nodes(list) {
  return `<h2>NODES</h2>` + (list || []).map(n => {
    const lv = Object.fromEntries(Object.keys(LEVELS).map(k => [k, level(k, n[k])]));
    const st = worst([...Object.values(lv).map(l => l.state), n.disk >= 95 ? "fail" : n.disk >= 85 ? "warn" : "ok"]);
    const rows = Object.keys(LEVELS).map(k => {
      const v = n[k] === undefined || n[k] === null ? "--" : k === "temp" ? `${Math.round(n[k])}°` : `${Math.round(n[k])}%`;
      return `<span class="k">${LEVELS[k][0]}</span><span class="bar ${lv[k].state}">${segs(8, Math.ceil(lv[k].pct / 12.5))}</span><span class="v">${v}</span>`;
    }).join("");
    return `<div class="node ${st}"><div class="host">${esc(n.node)} <span class="k">dsk ${Math.round(n.disk ?? 0)}%</span></div>${rows}</div>`;
  }).join("");
}

// The CRT's label and colour, as before.
function crtLabel(s) {
  const all = Object.values(s.groups || {}).flatMap(g => g.checks);
  const failing = all.filter(c => c.state === "fail");
  const warning = all.filter(c => c.state === "warn");
  if (failing.length) return `${failing.length} failing: ${failing[0].name}`;
  const running = (s.groups?.builds?.checks || []).find(c => c.state === "active");
  if (running) return `running: ${running.name}`;
  if (warning.length) return `${warning.length} degraded: ${warning[0].name}`;
  if (s.overall === "unknown") return "no data from prometheus";
  if (s.groups?.wigle?.state === "active") return "wigle-sync uploading";
  return "all systems nominal";
}
function matrixColour(s) {
  if (s.overall === "fail") return "red";
  if (s.overall === "warn" || s.groups?.builds?.state === "active") return "yellow";
  if (s.overall === "unknown") return "white";
  return "green";
}

// Opened through the LAN proxy rather than on brick9000's own screen: a
// read-only mirror, with the CRT window left empty (only the kiosk runs cmatrix).
const MIRROR = !["127.0.0.1", "localhost"].includes(location.hostname);
document.body.classList.toggle("mirror", MIRROR);

// The CRT window's program, streamed from brick-status and drawn by xterm.js.
const TINTS = {
  green: { dark: "#020306", bright: "#8cffb0", fg: "#39ff6a" },
  yellow: { dark: "#0a0602", bright: "#ffd27a", fg: "#ffb300" },
  red: { dark: "#0a0204", bright: "#ff7a90", fg: "#ff3355" },
  white: { dark: "#05060a", bright: "#c9f3ff", fg: "#6c7c95" },
};
const BASE_THEME = {
  background: "rgba(0,0,0,0)", foreground: "#39ff6a",
  black: "#020306", green: "#20d455", brightGreen: "#8cffb0",
  yellow: "#ffb300", brightYellow: "#ffd27a", red: "#ff3355", brightRed: "#ff7a90",
  white: "#6c7c95", brightWhite: "#c9f3ff", cyan: "#00eaff", brightCyan: "#8ff6ff",
  magenta: "#ff2bd6", brightMagenta: "#ff8ae9",
};
const XTERM_256 = (() => {
  const ansi = ["000000","cd0000","00cd00","cdcd00","0000ee","cd00cd","00cdcd","e5e5e5",
                "7f7f7f","ff0000","00ff00","ffff00","5c5cff","ff00ff","00ffff","ffffff"]
    .map(h => [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)));
  const step = [0, 95, 135, 175, 215, 255], cube = [];
  for (let r = 0; r < 6; r++) for (let g = 0; g < 6; g++) for (let b = 0; b < 6; b++)
    cube.push([step[r], step[g], step[b]]);
  const greys = Array.from({ length: 24 }, (_, i) => [8 + i * 10, 8 + i * 10, 8 + i * 10]);
  return [...ansi, ...cube, ...greys];
})();
const hex = c => "#" + c.map(v => Math.round(v).toString(16).padStart(2, "0")).join("");
const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function tintTheme(colour) {
  const t = TINTS[colour] || TINTS.green, dark = rgb(t.dark), bright = rgb(t.bright);
  const shade = ([r, g, b]) => {
    const lum = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
    const k = lum === 0 ? 0 : 0.3 + 0.7 * lum;
    return hex(dark.map((d, i) => d + (bright[i] - d) * k));
  };
  const c = XTERM_256.map(shade);
  const names = ["black","red","green","yellow","blue","magenta","cyan","white"];
  const theme = { background: "rgba(0,0,0,0)", foreground: t.fg, extendedAnsi: c.slice(16) };
  names.forEach((n, i) => { theme[n] = c[i]; theme["bright" + n[0].toUpperCase() + n.slice(1)] = c[i + 8]; });
  return theme;
}
const ACTIVITY_HOLD_SECONDS = 6;
let activityUntil = 0;
function crtProgram(s) {
  const now = s.now || Date.now() / 1000;
  if (s.activity) activityUntil = now + ACTIVITY_HOLD_SECONDS;
  if (now < activityUntil && s.crt?.activity) return s.crt.activity;
  const list = s.crt?.programs?.length ? s.crt.programs : [{ name: "cmatrix", tint: false, font: 11 }];
  const slot = Math.floor(now / 60 / (s.crt?.minutes || 360));
  return list[slot % list.length];
}
function makeTerm(elementId) { return {
  term: null, fit: null, source: null, key: null,
  start(colour, program = { name: "cmatrix", tint: false }) {
    if (MIRROR) return;
    const key = `${program.name}/${colour}`;
    if (this.source && this.key === key) return;
    this.stop();
    if (!this.term) {
      this.term = new Terminal({
        fontFamily: '"IBM Plex Mono", monospace', fontSize: 11, lineHeight: 1.0,
        cursorBlink: false, disableStdin: true, scrollback: 0, allowTransparency: true, theme: BASE_THEME,
      });
      this.fit = new FitAddon.FitAddon();
      this.term.loadAddon(this.fit);
      this.term.open(document.getElementById(elementId));
      try {  // the GPU renderer: the DOM one kept Chromium above a full core on the Pi 4
        const webgl = new WebglAddon.WebglAddon();
        webgl.onContextLoss(() => webgl.dispose());
        this.term.loadAddon(webgl);
      } catch (e) { console.warn("WebGL renderer unavailable, using DOM renderer", e); }
    }
    this.term.options.theme = program.tint ? tintTheme(colour) : BASE_THEME;
    this.term.options.fontSize = program.font || 11;
    this.fit.fit();
    this.term.reset();
    this.key = key;
    const q = new URLSearchParams({ cols: this.term.cols, rows: this.term.rows, colour, program: program.name });
    this.source = new EventSource(`/api/matrix?${q}`);
    this.source.onmessage = e => this.term.write(Uint8Array.from(atob(e.data), c => c.charCodeAt(0)));
  },
  stop() { if (this.source) { this.source.close(); this.source = null; } this.key = null; },
}; }
const matrix = makeTerm("term");
const matrixLog = makeTerm("term-log");

// Only touch the DOM when the markup changes, so animations don't restart every poll.
function setHTML(id, html) {
  const el = document.getElementById(id);
  if (el.dataset.html !== html) { el.innerHTML = html; el.dataset.html = html; }
}
function setState(id, state) {
  const el = document.getElementById(id);
  for (const s of SEVERITY) el.classList.toggle(s, s === state);
}

function render(s) {
  const g = s.groups || {};
  document.body.classList.toggle("alarm", s.overall === "fail");
  setHTML("summary", summary(s));
  setHTML("lamp", lampPanel(s.lamp));
  setState("lamp-panel", s.lamp ? (s.lamp.on ? "warn" : "ok") : "unknown");
  setHTML("deploy", deployPanel(g.argocd));
  setState("deploy-panel", g.argocd?.state || "unknown");

  const view = s.view || "overview";
  const right = document.getElementById("right");
  right.classList.toggle("detail", view !== "overview");
  document.getElementById("anomaly-panel").hidden = view !== "overview";
  if (view === "builds") {
    document.getElementById("main-title").textContent = "PIPELINE // ALL JOBS";
    setHTML("main-list", detail(s, [["JENKINS", "builds"]]));
    setState("main-panel", g.builds?.state || "unknown");
  } else if (view === "cluster") {
    document.getElementById("main-title").textContent = "CLUSTER";
    setHTML("main-list", detail(s, [["NODES & WORKLOADS", "cluster"], ["ARGO CD", "argocd"], ["UNITS", "services"], ["WIGLE", "wigle"]]));
    setState("main-panel", worst(["cluster", "argocd", "services", "wigle"].map(n => g[n]?.state || "unknown")));
  } else {
    document.getElementById("main-title").textContent = "PIPELINE";
    setHTML("main-list", pipeline(g.builds));
    setState("main-panel", g.builds?.state || "unknown");
    setHTML("anomalies", anomalies(s));
  }
  setHTML("nodes-panel", nodes(s.vitals));

  const crt = document.getElementById("crt");
  const program = crtProgram(s);
  const split = program.name === "activity" && !!s.crt?.activity_log;
  crt.className = `crt panel ${s.overall || "unknown"}${split ? " split" : ""}`;
  document.getElementById("crt-label").textContent = "> " + crtLabel(s);
  if (s.mode !== "quiet") {
    matrix.start(matrixColour(s), program);
    if (split) matrixLog.start(matrixColour(s), s.crt.activity_log);
    else matrixLog.stop();
  } else { matrix.stop(); matrixLog.stop(); }

  document.getElementById("sshd").hidden = s.host?.sshd !== false;
  document.getElementById("internet").hidden = s.host?.internet !== false;
  const off = document.getElementById("display-off");
  off.hidden = s.mode !== "quiet";
  off.textContent = s.asleep_until ? "ASLEEP TILL " + new Date(s.asleep_until * 1000).toLocaleString("en-US",
    { weekday: "short", hour: "numeric", minute: "2-digit", hour12: true }).toUpperCase() : "DISPLAY OFF";
  const awake = document.getElementById("awake");
  awake.hidden = !s.awake_until;
  if (s.awake_until) awake.textContent = "AWAKE TILL " +
    new Date(s.awake_until * 1000).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", hour12: true });

  const age = s.updated ? Math.round(s.now - s.updated) : null;
  const fresh = document.getElementById("fresh");
  fresh.textContent = age === null ? "waiting" : `t-${age}s`;
  fresh.classList.toggle("stale", age === null || age > 60);

  setHTML("pad", PAD.map(([v, label], i) =>
    `<span data-n="${i + 1}" class="${v === view ? "on" : ""}">${label}</span>`).join(""));
}

function tick() {
  document.getElementById("clock").textContent =
    new Date().toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit", hour12: false });
}

let boot = null;
async function poll() {
  try {
    const s = await (await fetch("/api/state", { cache: "no-store" })).json();
    if (boot && s.boot !== boot) { location.reload(); return; }  // brick-status restarted: load the page it serves now
    boot = s.boot;
    render(s);
  } catch (e) {
    document.getElementById("fresh").textContent = "LINK LOST";
    document.getElementById("fresh").classList.add("stale");
  }
}

document.fonts.load('15px "VT323"').finally(() => {
  tick(); poll(); pollVolume();
  setInterval(tick, 1000);
  setInterval(poll, 1000);
  setInterval(pollVolume, 3000);
});
</script>
</body>
</html>
