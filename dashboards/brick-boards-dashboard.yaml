# Grafana dashboard for brick-status, the LCARS panel, brick-retro and the hosts'
# oneshot units (README, "Metrics"). Grafana's sidecar loads any ConfigMap
# labelled grafana_dashboard.
#   kubectl apply -f dashboards/
apiVersion: v1
kind: ConfigMap
metadata:
  name: brick-boards-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
