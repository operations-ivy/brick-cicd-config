# The volume dial: an M5Stack Dial v1.1 (ESP32-S3, 1.28" round screen, a
# rotary encoder around it) parked next to brick9000. Turning it sets
# brick9000's speaker volume, pressing the screen mutes, and it follows
# changes made anywhere else (the pad, the web page). It talks only to
# brick-status's /api/volume through volume.brick.nozdormu.cloud: no Home
# Assistant, no cluster. See README.md here.
substitutions:
  # Plain HTTP, LAN only (brick9000's Caddyfile): a TLS handshake takes the
  # ESP32 ~2.7 s, and each request blocks the dial while it runs.
  api_url: http://volume.brick.nozdormu.cloud/api/volume
  # One click of the encoder; 20 clicks from silent to the cap.
  step: "0.05"

esphome:
  name: volume-dial
  friendly_name: Volume dial
  on_boot:
    priority: 600
    then:
      - light.turn_on:
          id: backlight
          brightness: 100%

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  flash_size: 8MB
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # A Wi-Fi drop shouldn't reboot it every few minutes; it shows "no Wi-Fi"
  # and keeps trying.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

http_request:
  verify_ssl: false
  timeout: 2s

globals:
  # 0-1 of the cap, as /api/volume reports it.
  - id: level
    type: float
    initial_value: "0"
  - id: muted
    type: bool
    initial_value: "false"
  # Set once a GET has succeeded; until then the screen says so.
  - id: known
    type: bool
    initial_value: "false"
  - id: online
    type: bool
    initial_value: "false"
  # When the dial was last turned or pressed (millis): polls wait until it's
  # been left alone, so a slow GET can't drag the level back mid-turn.
  - id: touched
    type: uint32_t
    initial_value: "0"
  # The screen needs redrawing (the 20 ms interval below does it, once,
  # however many clicks came in meanwhile).
  - id: dirty
    type: bool
    initial_value: "true"

script:
  # Turning sends the new level 150 ms after the last click (restart mode), so
  # a fast spin is one request, not twenty.
  - id: send_level
    mode: restart
    then:
      - delay: 150ms
      - http_request.post:
          url: ${api_url}
          json: |-
            root["level"] = id(level);
            if (id(muted)) root["muted"] = false;
          on_response:
            then:
              - lambda: |-
                  id(online) = response->status_code == 200;
                  if (id(online)) id(muted) = false;
          on_error:
            then:
              - lambda: id(online) = false;
      - lambda: id(dirty) = true;
  - id: send_mute
    mode: queued
    then:
      - http_request.post:
          url: ${api_url}
          json: |-
            root["muted"] = id(muted);
          on_response:
            then:
              - lambda: id(online) = response->status_code == 200;
          on_error:
            then:
              - lambda: id(online) = false;
      - lambda: id(dirty) = true;
  - id: wake
    then:
      - lambda: id(touched) = millis();
      - light.turn_on:
          id: backlight
          brightness: 100%
          transition_length: 0s

sensor:
  - platform: rotary_encoder
    id: knob
    pin_a: GPIO40
    pin_b: GPIO41
    resolution: 1
    on_clockwise:
      - lambda: |-
          id(level) = std::min(1.0f, id(level) + ${step}f);
          id(known) = true;
      - script.execute: wake
      - lambda: id(dirty) = true;
      - script.execute: send_level
    on_anticlockwise:
      - lambda: |-
          id(level) = std::max(0.0f, id(level) - ${step}f);
          id(known) = true;
      - script.execute: wake
      - lambda: id(dirty) = true;
      - script.execute: send_level

binary_sensor:
  # The button under the screen: press to mute or unmute.
  - platform: gpio
    pin:
      number: GPIO42
      inverted: true
    id: press
    on_press:
      - lambda: id(muted) = !id(muted);
      - script.execute: wake
      - lambda: id(dirty) = true;
      - script.execute: send_mute

interval:
  # Follow changes made elsewhere, unless the dial was used in the last 2 s.
  - interval: 2s
    then:
      - if:
          condition:
            lambda: return millis() - id(touched) > 2000;
          then:
            - http_request.get:
                url: ${api_url}
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) {
                          id(online) = false;
                          return;
                        }
                        // Ignore it if the dial was turned while the request was out.
                        if (millis() - id(touched) <= 2000) return;
                        bool ok = json::parse_json(body, [](JsonObject root) -> bool {
                          if (!root["level"].is<float>()) return false;
                          id(level) = root["level"].as<float>();
                          id(muted) = root["muted"].as<bool>();
                          return true;
                        });
                        id(online) = ok;
                        id(known) |= ok;
                    - lambda: id(dirty) = true;
                on_error:
                  then:
                    - lambda: id(online) = false;
                    - lambda: id(dirty) = true;
  # Redraw when something changed, at most once per pass: a fast turn is one
  # redraw, not one per click queued behind each other.
  - interval: 20ms
    then:
      - lambda: |-
          if (!id(dirty)) return;
          id(dirty) = false;
          id(screen).update();
  # Dim the screen after a minute untouched; turning or pressing wakes it.
  - interval: 5s
    then:
      - if:
          condition:
            lambda: return millis() - id(touched) > 60000;
          then:
            - light.turn_on:
                id: backlight
                brightness: 25%
                transition_length: 1s

output:
  - platform: ledc
    pin: GPIO9
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    id: backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

spi:
  clk_pin: GPIO6
  mosi_pin: GPIO5
  interface: hardware

# The board's palette (brick-status/brick_status/static/index.html).
color:
  - id: bunker
    hex: "0e1411"
  - id: track
    hex: "232e27"  # --panel-edge: the arc's unlit part
  - id: bone
    hex: "d9d3bf"
  - id: dim
    hex: "7a857c"
  - id: phosphor
    hex: "2ee84a"
  - id: rust
    hex: "c4442c"
  - id: yellow
    hex: "e3c23a"
  - id: orange
    hex: "d9822b"
  - id: crt
    hex: "07100b"  # the CRT window's glass
  - id: scanline
    hex: "0c1a11"
  - id: panel
    hex: "161e19"

font:
  - file: "gfonts://IBM Plex Mono@700"
    id: big
    size: 60
    bpp: 4
    glyphs: "0123456789-"
  - file: "gfonts://Barlow Condensed@600"
    id: small
    size: 22
    bpp: 4
  - file: "gfonts://Barlow Condensed@600"
    id: caption
    size: 15
    bpp: 4
    glyphs: " .09BCEFIKLMNORSUV"

display:
  - platform: mipi_spi
    id: screen
    model: GC9A01A
    cs_pin: GPIO7
    dc_pin: GPIO4
    reset_pin: GPIO8
    invert_colors: true
    # 80 MHz, as M5Stack's own library drives the Dial's GC9A01.
    data_rate: 80MHz
    # The whole screen in RAM (115 KB; the Dial has no PSRAM). With the
    # default part-screen buffer the lambda ran once per strip, six times a
    # frame: ~270 ms a redraw, too slow to animate and long enough to lag.
    buffer_size: 100%
    # Redrawn on every change, and with each poll.
    update_interval: never
    lambda: |-
      const int cx = 120, cy = 120;
      const float start = 135.0f, sweep = 270.0f;  // 7:30 round to 4:30, like a knob
      const float deg = M_PI / 180.0f;
      const float lv = id(level);
      const bool mute = id(muted);
      it.fill(id(bunker));

      // The ring: 20 segments, one per click, green into yellow and orange
      // toward the cap, like a VU meter. Grey when muted.
      const int segs = 20;
      const float gap = 2.5f, r_in = 95, r_out = 115;
      auto heat = [&](float f) -> Color {
        if (f <= 0.6f) return id(phosphor);
        if (f <= 0.85f) return id(phosphor).gradient(id(yellow), (uint8_t) ((f - 0.6f) / 0.25f * 255));
        return id(yellow).gradient(id(orange), (uint8_t) std::min(255.0f, (f - 0.85f) / 0.15f * 255));
      };
      for (int i = 0; i < segs; i++) {
        float f0 = (float) i / segs, f1 = (float) (i + 1) / segs;
        float a0 = (start + sweep * f0 + gap / 2) * deg, a1 = (start + sweep * f1 - gap / 2) * deg;
        int ax = cx + r_in * cosf(a0), ay = cy + r_in * sinf(a0);
        int bx = cx + r_out * cosf(a0), by = cy + r_out * sinf(a0);
        int qx = cx + r_out * cosf(a1), qy = cy + r_out * sinf(a1);
        int dx = cx + r_in * cosf(a1), dy = cy + r_in * sinf(a1);
        bool lit = lv > f0 + 0.01f;
        Color c = !lit ? id(track) : mute ? id(dim) : heat(f1);
        it.filled_triangle(ax, ay, bx, by, qx, qy, c);
        it.filled_triangle(ax, ay, qx, qy, dx, dy, c);
      }
      // Ticks inside the ring: every click, longer every quarter.
      for (int i = 0; i <= segs; i++) {
        float a = (start + sweep * i / segs) * deg;
        bool major = i % 5 == 0;
        float r0 = major ? 83 : 87, r1 = 91;
        it.line(cx + r0 * cosf(a), cy + r0 * sinf(a), cx + r1 * cosf(a), cy + r1 * sinf(a),
                major ? id(bone) : id(dim));
      }

      // The CRT window: dark glass with scanlines, in a panel-edge bezel.
      const int rg = 76;
      for (int y = -rg; y <= rg; y++) {  // one pass: glass, every third row a scanline
        int w = (int) sqrtf((float) (rg * rg - y * y));
        it.horizontal_line(cx - w, cy + y, 2 * w + 1, (y + rg) % 3 == 1 ? id(scanline) : id(crt));
      }
      it.circle(cx, cy, rg + 1, id(panel));
      it.circle(cx, cy, rg + 2, id(panel));
      it.circle(cx, cy, rg + 3, id(track));

      // The pointer, riding the end of the arc.
      {
        float a = (start + sweep * lv) * deg;
        int px = cx + 105 * cosf(a), py = cy + 105 * sinf(a);
        it.filled_circle(px, py, 8, id(bunker));
        it.filled_circle(px, py, 6, mute ? id(dim) : id(bone));
      }

      if (!id(known)) {
        it.print(cx, cy, id(small), id(dim), TextAlign::CENTER, id(online) ? "..." : "NO SIGNAL");
        return;
      }
      it.print(cx, cy - 46, id(caption), id(dim), TextAlign::CENTER, "VOLUME");
      if (muted) {
        // A hazard band, like a failing tile on the board.
        it.start_clipping(display::Rect(cx - 64, cy - 15, 128, 30));
        for (int k = -96; k < 96; k += 14)
          for (int t = 0; t < 6; t++)
            it.line(cx + k + t, cy + 15, cx + k + t + 30, cy - 15, id(rust));
        it.end_clipping();
        it.filled_rectangle(cx - 38, cy - 12, 76, 24, id(crt));
        it.print(cx, cy, id(small), id(bone), TextAlign::CENTER, "MUTED");
      } else {
        it.printf(cx, cy - 2, id(big), heat(std::max(lv, 0.05f)), TextAlign::CENTER, "%d",
                  (int) roundf(id(level) * 100));
      }
      it.print(cx, cy + 44, id(caption), id(online) ? id(dim) : id(rust), TextAlign::CENTER,
               id(online) ? "BRICK9000" : "OFFLINE");
